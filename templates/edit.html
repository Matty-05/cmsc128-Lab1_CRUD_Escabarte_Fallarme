<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Task &middot; CMSC 128 Lab 1</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="app-header">
    <h1>My To-Do List</h1>
    <p class="subtitle">CMSC 128 Lab 1 &middot; Escabarte &amp; Fallarme</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">Edit Task</h2>

      <form action="{{ url_for('edit_task', task_id=task.id, **request.args) }}" method="POST">
        <div class="field">
          <label for="title">Title <span class="required">*</span></label>
          <input type="text" id="title" name="title" value="{{ task.title }}" maxlength="200" required />
        </div>

        <div class="field">
          <label for="due-date">Due date &amp; time</label>
          <input type="datetime-local" id="due-date" name="due_date" value="{{ task.due_date }}" required/>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="priority">Priority <span class="required">*</span></label>
            <select id="priority" name="priority" required>
              <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
              <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
              <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
            </select>
          </div>

          <div class="field">
            <label for="tag">Tag <span class="required">*</span></label>
            <select id="tag" name="tag" required>
              <option value="School" {% if task.tag == 'School' %}selected{% endif %}>School</option>
              <option value="Personal" {% if task.tag == 'Personal' %}selected{% endif %}>Personal</option>
              <option value="Others" {% if task.tag == 'Others' %}selected{% endif %}>Others</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Task</button>
          <a href="{{ url_for('index', **request.args) }}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
