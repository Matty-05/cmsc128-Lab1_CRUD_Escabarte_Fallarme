<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List &middot; CMSC 128 Lab 1</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="app-header">
    <h1>My To-Do List</h1>
    <p class="subtitle">CMSC 128 Lab 1 &middot; Escabarte &amp; Fallarme</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">Add a task</h2>

      <form id="task-form" action="{{ url_for('add_task', **request.args) }}" method="POST">
        <div class="field">
          <label for="title">Title <span class="required">*</span></label>
          <input type="text" id="title" name="title" maxlength="200"
                 placeholder="e.g. Finish CMSC 128 lab report" required />
        </div>

        <div class="field">
          <label for="due-date">Due date &amp; time <span class="required">*</span></label>
          <input type="datetime-local" id="due-date" name="due_date" required />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="priority">Priority <span class="required">*</span></label>
            <select id="priority" name="priority" required>
              <option value="" disabled selected hidden>Select priority</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div class="field">
            <label for="tag">Tag <span class="required">*</span></label>
            <select id="tag" name="tag" required>
              <option value="" disabled selected hidden>Select tag</option>
              <option value="School">School</option>
              <option value="Personal">Personal</option>
              <option value="Others">Others</option>
            </select>
          </div>
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add task</button>
        </div>
      </form>
    </section>

    {% include "_tasks_panel.html" %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
